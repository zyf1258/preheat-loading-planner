<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>装炉安排</title>
<style>
:root{--ink:#17242c;--muted:#63727b;--line:#d8e0e3;--bg:#f2f5f5;--navy:#173744;--blue:#176b8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei",sans-serif;letter-spacing:0}button{min-height:36px;border:1px solid transparent;border-radius:5px;padding:0 13px;background:var(--blue);color:#fff;cursor:pointer;font:inherit}button:hover{filter:brightness(.94)}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#fff;color:#294854;border-color:#bdcbd1}header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:#c8d7dc;font-size:12px}.badge{display:inline-flex;align-items:center;min-height:28px;padding:0 9px;border-radius:4px;background:#e7eff2;color:#294854;font-size:12px;font-weight:700}.shell{max-width:1500px;margin:0 auto;padding:22px}.intro{margin-bottom:16px}.eyebrow{margin:0 0 5px;color:#45727e;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.intro h2{margin:0;font-size:24px}.intro p:not(.eyebrow){margin:6px 0 0;color:var(--muted);font-size:12px}.panel{background:#fff;border:1px solid var(--line);padding:14px;margin-bottom:12px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:11px}.panel-head h3{margin:3px 0 0;font-size:15px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.embedded-planner .panel-head{align-items:center}.embedded-planner .panel-head p{max-width:760px}.embedded-planner iframe{display:block;width:100%;height:860px;border:1px solid #cbd7d9;background:#f3f6f7}.embedded-planner .panel-head button{background:#fff;color:#294854;border-color:#bdcbd1}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.shell{padding:16px 12px}.intro h2{font-size:21px}.embedded-planner{padding:10px}.embedded-planner iframe{height:900px}}
</style>
</head>
<body>
<header><div><h1>装炉排程（独立版）</h1><p>当天计划导入、长度记忆、自动排炉和手动换炉</p></div><span class="badge">1403–1413</span></header>
<main class="shell">
  <section class="intro"><p class="eyebrow">EXISTING PLANNER</p><h2>现有装炉排程模块</h2><p>在下方完成当天计划导入、自动排炉和手动换炉。</p></section>
  <section class="embedded-planner panel"><div class="panel-head"><div><span class="eyebrow">PLANNER</span><h3>预热炉排炉</h3><p>保留原排程界面与操作逻辑。</p></div><button id="toggleLegacyPlanner" type="button" class="secondary" aria-expanded="true">收起旧排程</button></div><div id="legacyPlannerFrame"><iframe id="legacyPlanner" title="现有装炉排程模块" src="/legacy-planner.html"></iframe></div></section>
</main>
 <script>const frame=document.getElementById('legacyPlannerFrame');const toggle=document.getElementById('toggleLegacyPlanner');toggle.onclick=()=>{const collapsed=!frame.hidden;frame.hidden=collapsed;toggle.textContent=collapsed?'展开旧排程':'收起旧排程';toggle.setAttribute('aria-expanded',String(!collapsed))};</script>
</body>
</html>
